name: release
# Builds the release packages on a version tag (or by hand) and keeps them as
# workflow artifacts. Nothing is published: there is no release, upload or
# deploy step. Third-party actions are pinned by commit.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_ABOUT_VERSION: "0.9.3"
  # llvm-mingw for the Windows cross build, as pinned in docs/build.md.
  LLVM_MINGW_NAME: llvm-mingw-20261104-ucrt-macos-universal
  LLVM_MINGW_URL: https://github.com/mstorsjo/llvm-mingw/releases/download/20261104/llvm-mingw-20261104-ucrt-macos-universal.tar.xz
  LLVM_MINGW_SHA256: 66cbd5178c4a71b0d473e68ede172f8eb7d15d023e67f39201d0a69e21f6bf3c
  # The macOS runner's login name is "runner", a word our notices use; the
  # guard keeps its home and checkout paths as forbidden strings.
  MILIONAR_GUARD_ALLOW: runner

jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Rust toolchain
        run: rustup toolchain install
      - name: Packaging tests
        run: python3 -B -m unittest discover -s packaging && python3 -B -m unittest discover -s tools/release
      - name: Rust crate licences are up to date
        run: |
          cargo install cargo-about --locked --features cli --version "$CARGO_ABOUT_VERSION" \
              --root "tools/cache/cargo-about-$CARGO_ABOUT_VERSION"
          cargo fetch --locked
          tools/release/gen-licenses.sh --check
      - name: App
        run: packaging/macos/build-app.sh
      - name: Disk image
        run: packaging/macos/build-dmg.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: milionar-macos-arm64
          path: |
            dist/Milionar-*-macos-arm64.dmg
            dist/Milionar-*-macos-arm64.dmg.sha256
            dist/Milionar-*-macos-arm64.app.sha256
          if-no-files-found: error

  windows-tree:
    # Cross-built on macOS with the same toolchain as local builds
    # (tools/build-windows.sh), so the shipped exe matches a local build.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: llvm-mingw
        run: |
          mkdir -p tools/cache
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/llvm-mingw.tar.xz" "$LLVM_MINGW_URL"
          echo "$LLVM_MINGW_SHA256  $RUNNER_TEMP/llvm-mingw.tar.xz" | shasum -a 256 -c -
          tar -xJf "$RUNNER_TEMP/llvm-mingw.tar.xz" -C tools/cache
          test -x "tools/cache/$LLVM_MINGW_NAME/bin/x86_64-w64-mingw32-clang"
      - name: Rust toolchain and target
        run: |
          rustup toolchain install
          rustup target add --toolchain 1.100 x86_64-pc-windows-gnullvm
      - name: Install tree
        run: packaging/windows/build-tree.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: milionar-windows-x64-tree
          path: |
            dist/Milionar-windows-x64
            dist/Milionar-*-windows-x64.tree.sha256
          if-no-files-found: error

  windows-installer:
    needs: windows-tree
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      # .gitattributes fixes the line endings (LF for scripts, the .iss byte for
      # byte), so the image's core.autocrlf does not change the checkout.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Checkout has LF scripts
        run: |
          if grep -l $'\r' packaging/windows/*.sh packaging/*.py; then
              echo "error: CRLF in the scripts above" >&2
              exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: python3 for the packaging scripts
        run: |
          d="$RUNNER_TEMP/py3"
          mkdir -p "$d"
          printf '#!/bin/sh\nexec python "$@"\n' > "$d/python3"
          chmod +x "$d/python3"
          cygpath -w "$d" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: milionar-windows-x64-tree
          path: dist
      - name: Tree matches the hashes from the build
        run: |
          python3 --version
          python3 packaging/guard.py hashes --root dist/Milionar-windows-x64 --out "$RUNNER_TEMP/tree.sha256"
          diff dist/Milionar-*-windows-x64.tree.sha256 "$RUNNER_TEMP/tree.sha256"
      - name: Inno Setup
        # The preinstalled Inno Setup 6; when the image has none, the version
        # pinned in tools/upscalers/innosetup.lock.json, checked by SHA-256.
        run: |
          iscc='C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if [ ! -f "$(cygpath -u "$iscc")" ]; then
              lock=tools/upscalers/innosetup.lock.json
              val() { python3 -c 'import json, sys; print(json.load(open(sys.argv[1]))["innosetup"][sys.argv[2]])' "$lock" "$1"; }
              setup="$RUNNER_TEMP/$(val name)"
              curl -fsSL --retry 3 -o "$setup" "$(val url)"
              echo "$(val sha256)  $setup" | sha256sum -c -
              # shellcheck disable=SC2046 # the pinned arguments are split on purpose
              MSYS_NO_PATHCONV=1 "$setup" $(val install_args)
              iscc="$(val install_dir)\\ISCC.exe"
          fi
          test -f "$(cygpath -u "$iscc")"
          echo "ISCC=$iscc" >> "$GITHUB_ENV"
      - name: Installer
        run: packaging/windows/build-installer.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: milionar-windows-x64-setup
          path: |
            dist/Milionar-*-windows-x64-setup.exe
            dist/Milionar-*-windows-x64-setup.exe.sha256
          if-no-files-found: error
