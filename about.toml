# cargo-about configuration (version pinned in docs/build.md). Generates
# packaging/licenses/rust-crates.html with tools/release/gen-licenses.sh:
# the Rust crates linked into the shipped app (macOS arm64, Windows x64
# gnullvm), with their licence texts. Order = preference for "OR" choices.
accepted = [
    "MIT",
    "Apache-2.0",
    "Zlib",
    "BSD-3-Clause",
    "Unicode-3.0",
    "IJG",
    "MPL-2.0",
    "GPL-3.0-only",
]
targets = [
    "aarch64-apple-darwin",
    "x86_64-pc-windows-gnullvm",
]
ignore-dev-dependencies = true
# Licence files only at the crate root: sdl3-src carries the whole SDL source
# tree, whose per-file headers would otherwise each become an entry (SDL and
# its bundled parts ship as licenses/SDL3-zlib.txt).
max-depth = 1

# Our own workspace crates (publish = false) are GPL-3.0-only; LICENSE ships
# beside the app, so they are left out of the page.
[private]
ignore = true

# The crates' own licence files (with their copyright lines) where cargo-about
# would otherwise fall back to the canonical SPDX text. Checksums pin the files.

